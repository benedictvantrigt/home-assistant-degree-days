name: Release

# Publishes a GitHub release (and tag) for the version in manifest.json when
# that version has no release yet. HACS lists releases as the versions you
# can install. To release, bump "version" in manifest.json on main.
on:
  push:
    branches:
      - main
    paths:
      - custom_components/degree_days/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/degree_days/manifest.json'))['version'])")
          tag="v${version}"
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
