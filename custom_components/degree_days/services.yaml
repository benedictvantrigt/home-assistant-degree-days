compare_periods:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: degree_days
    period_a_start:
      required: true
      example: "2024-01-01"
      selector:
        date:
    period_a_end:
      required: true
      example: "2024-12-31"
      selector:
        date:
    period_b_start:
      required: true
      example: "2025-01-01"
      selector:
        date:
    period_b_end:
      required: true
      example: "2025-12-31"
      selector:
        date:
get_daily_data:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: degree_days
    start:
      required: true
      example: "2025-01-01"
      selector:
        date:
    end:
      required: true
      example: "2025-12-31"
      selector:
        date:
    group_by:
      default: day
      selector:
        select:
          translation_key: group_by
          options:
            - day
            - week
            - month
            - year
rebuild_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: degree_days
